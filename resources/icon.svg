<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Bails — token eye</title>
  <!-- Stepped, rounded-square tile; the corner pixels remain transparent. -->
  <g fill="#2b1f3d">
    <rect x="4" y="1" width="24" height="30"/>
    <rect x="2" y="3" width="28" height="26"/>
    <rect x="1" y="5" width="30" height="22"/>
  </g>
  <g fill="#5b5fa8">
    <rect x="4" y="1" width="24" height="1"/>
    <rect x="2" y="3" width="1" height="26"/>
    <rect x="3" y="2" width="1" height="2"/>
    <rect x="28" y="2" width="1" height="2"/>
    <rect x="29" y="3" width="1" height="26"/>
    <rect x="1" y="5" width="1" height="22"/>
    <rect x="30" y="5" width="1" height="22"/>
    <rect x="3" y="28" width="1" height="2"/>
    <rect x="28" y="28" width="1" height="2"/>
    <rect x="4" y="30" width="24" height="1"/>
  </g>
  <g fill="#3a2a52">
    <rect x="4" y="3" width="24" height="26"/>
    <rect x="3" y="5" width="26" height="22"/>
  </g>
  <g fill="#7c80c9">
    <rect x="4" y="2" width="23" height="1"/>
    <rect x="3" y="4" width="1" height="14"/>
    <rect x="2" y="5" width="1" height="8"/>
  </g>
  <!-- Coin outline: each step lies on the 32 by 32 pixel grid. -->
  <g fill="#7a2e12">
    <rect x="12" y="5" width="8" height="22"/>
    <rect x="9" y="6" width="14" height="20"/>
    <rect x="7" y="8" width="18" height="16"/>
    <rect x="6" y="10" width="20" height="12"/>
    <rect x="5" y="13" width="22" height="6"/>
  </g>
  <!-- Discrete bands form the warm coin gradient without interpolation. -->
  <g fill="#ffc24a">
    <rect x="12" y="6" width="8" height="1"/>
    <rect x="9" y="7" width="14" height="2"/>
    <rect x="8" y="9" width="16" height="2"/>
    <rect x="7" y="11" width="18" height="2"/>
  </g>
  <g fill="#ff9a1f">
    <rect x="7" y="13" width="18" height="6"/>
    <rect x="6" y="13" width="1" height="6"/>
    <rect x="25" y="13" width="1" height="6"/>
    <rect x="7" y="19" width="18" height="2"/>
  </g>
  <g fill="#f2661c">
    <rect x="7" y="21" width="18" height="1"/>
    <rect x="8" y="22" width="16" height="2"/>
    <rect x="9" y="24" width="14" height="1"/>
    <rect x="12" y="25" width="8" height="1"/>
  </g>
  <!-- Top-left rim highlight and bottom-right inset bevel. -->
  <g fill="#f7e7c1">
    <rect x="12" y="6" width="7" height="1"/>
    <rect x="9" y="7" width="3" height="1"/>
    <rect x="8" y="9" width="1" height="2"/>
    <rect x="7" y="11" width="1" height="3"/>
    <rect x="6" y="14" width="1" height="3"/>
  </g>
  <g fill="#f2661c">
    <rect x="23" y="10" width="1" height="3"/>
    <rect x="24" y="13" width="1" height="7"/>
    <rect x="23" y="20" width="1" height="2"/>
  </g>
  <g fill="#7a2e12">
    <rect x="22" y="22" width="2" height="1"/>
    <rect x="20" y="23" width="3" height="1"/>
    <rect x="12" y="24" width="8" height="1"/>
  </g>
  <!-- Pixel eye with a dark socket, cream sclera, and square pupil. -->
  <g fill="#7a2e12">
    <rect x="12" y="11" width="8" height="10"/>
    <rect x="10" y="12" width="12" height="8"/>
    <rect x="9" y="13" width="14" height="6"/>
    <rect x="8" y="15" width="16" height="2"/>
  </g>
  <g fill="#f7e7c1">
    <rect x="12" y="12" width="8" height="8"/>
    <rect x="10" y="13" width="12" height="6"/>
    <rect x="9" y="15" width="14" height="2"/>
  </g>
  <g fill="#2b1f3d">
    <rect x="14" y="12" width="4" height="8"/>
    <rect x="13" y="14" width="6" height="4"/>
  </g>
  <rect x="14" y="13" width="1" height="1" fill="#f7e7c1"/>
</svg>

# Packaging config for Bails. Run `npm run dist` to build installers for the current OS.
appId: com.ansicode.bails
productName: Bails
copyright: Copyright © 2026 ansicode

directories:
  output: dist
  buildResources: resources

# Only the compiled app goes in the package: Vite already bundles React into out/.
files:
  - out/**
  - resources/icon.png
  - package.json

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Signed with the "Developer ID Application" certificate given by CSC_LINK / CSC_KEY_PASSWORD,
  # then notarized by Apple when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set
  # (see .github/workflows/release.yml). Hardened runtime is required for notarization; the
  # default electron-builder entitlements allow the JIT that Electron needs.
  hardenedRuntime: true

dmg:
  title: ${productName} ${version}

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Bails

linux:
  icon: resources/icon.png
  category: Development
  synopsis: Retro-arcade AI token usage tracker
  # Ties the running window (WM_CLASS / app_id) to the installed .desktop entry and its icon.
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm

publish: null
